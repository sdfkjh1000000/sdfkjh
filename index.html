/* ── ORIGINAL SITE SCRIPT ──────────────────────────────────────────────── */
(function(){
  const order   = ['k-s','k-d','k-f','k-k','k-j','k-h'];
  const letters = ['S','D','F','K','J','H'];
  const typed   = document.getElementById('typed');

  function pressSequence() {
    typed.textContent = '';
    order.forEach((id, i) => {
      const el = document.getElementById(id);
      setTimeout(() => {
        el.classList.add('pressed');
        typed.textContent += letters[i];
        setTimeout(() => el.classList.remove('pressed'), 150);
      }, i * 180);
    });
  }
  setTimeout(pressSequence, 800);
  setInterval(pressSequence, 3000);
})();

/* ── EASTER EGG: type "sdfkjh" anywhere to unlock NETRUNNER ─────────── */
(function(){
  const SECRET  = 'sdfkjh';
  // maps each letter → its key element id
  const keyMap  = { s:'k-s', d:'k-d', f:'k-f', k:'k-k', j:'k-j', h:'k-h' };
  let progress  = '';
  let launched  = false;

  document.addEventListener('keydown', function(e) {
    if (launched) return;
    // ignore modifier combos
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const ch = e.key.toLowerCase();

    if (ch === SECRET[progress.length]) {
      progress += ch;

      // light up the key in magenta
      const keyEl = document.getElementById(keyMap[ch]);
      if (keyEl) {
        keyEl.classList.add('hacked');
        setTimeout(() => keyEl.classList.remove('hacked'), 350);
      }

      if (progress === SECRET) {
        launched = true;
        glitchLaunch();
      }
    } else {
      // reset, but check if the wrong key starts a new sequence
      progress = (ch === SECRET[0]) ? ch : '';
    }
  });

  function glitchLaunch() {
    let ticks = 0;
    const glitch = setInterval(() => {
      const h = Math.random() * 360 | 0;
      document.body.style.filter = `hue-rotate(${h}deg) brightness(2.2) contrast(2)`;
      ticks++;
      if (ticks > 9) {
        clearInterval(glitch);
        document.body.style.filter = '';
        nrOpen();
      }
    }, 55);
  }
})();

/* ── MOBILE EASTER EGG: tap S→D→F→K→J→H keys in sequence ───────────── */
(function(){
  const sequence = ['k-s','k-d','k-f','k-k','k-j','k-h'];
  const RESET_MS = 3000;
  let progress = 0, timer = null, mobileLaunched = false;

  sequence.forEach(function(id, idx) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('touchstart', function(e) {
      if (document.getElementById('nr-overlay').classList.contains('active')) return;
      if (mobileLaunched) return;

      if (idx === progress) {
        progress++;
        el.classList.add('hacked');
        setTimeout(() => el.classList.remove('hacked'), 350);
        clearTimeout(timer);
        if (progress === sequence.length) {
          progress = 0;
          mobileLaunched = true;
          let ticks = 0;
          const glitch = setInterval(() => {
            const h = Math.random() * 360 | 0;
            document.body.style.filter = `hue-rotate(${h}deg) brightness(2.2) contrast(2)`;
            ticks++;
            if (ticks > 9) {
              clearInterval(glitch);
              document.body.style.filter = '';
              nrOpen();
            }
          }, 55);
        } else {
          timer = setTimeout(function(){ progress = 0; }, RESET_MS);
        }
      } else {
        progress = 0;
        clearTimeout(timer);
        if (idx === 0) {
          progress = 1;
          el.classList.add('hacked');
          setTimeout(() => el.classList.remove('hacked'), 350);
          timer = setTimeout(function(){ progress = 0; }, RESET_MS);
        }
      }
    }, { passive: true });
  });
})();

        'history -c':                     {r:['Command history cleared.'],t:'ok',o:'tracks'},
        'rm -f /var/log/auth.log':        {r:['auth.log deleted.'],t:'ok',o:'tracks'},
        'shred /var/log/auth.log':        {r:['Shredding auth.log... DONE'],t:'ok',o:'tracks'},
        'exit':                           {r:['Closing tunnel...','All clear. No traces found.'],t:'sys',o:'out'},
        'disconnect':                     {r:['Closing tunnel...','All clear. No traces found.'],t:'sys',o:'out'},
        'ls':                             {r:['blacknet_dump.sql  config.cfg  secret.txt'],t:'inf'},
        'help':                           {r:['Available: ps aux, mysqldump, history -c, rm -f &lt;log&gt;, exit'],t:'inf'},
      },
      obj:['dbin','dump','tracks','out'],
      hints:['<span class="nr-cmd">ps aux</span> to see running services','<span class="nr-cmd">mysqldump -u root -p blacknet</span>','<span class="nr-cmd">history -c</span> clears logs','<span class="nr-cmd">exit</span> to disconnect'],
      boot:['FINAL MISSION: Data Exfiltration.','MySQL detected on port 3306.','Dump everything. Cover tracks. Get out.'],
    },
  ];

  let score = 0, lvlIdx = 0, state = {}, history = [], histIdx = -1;
  const out    = document.getElementById('nr-out');
  const input  = document.getElementById('nr-input');
  const pb     = document.getElementById('nr-pb');
  const pblbl  = document.getElementById('nr-plabel');
  const nxtBtn = document.getElementById('nr-next');

  function print(html, cls, delay) {
    setTimeout(function(){
      const d = document.createElement('div');
      d.className = 'nl ' + (cls||'sys');
      d.innerHTML = html;
      out.appendChild(d);
      out.scrollTop = out.scrollHeight;
    }, delay||0);
  }
  function blank(delay){ setTimeout(function(){ const d=document.createElement('div'); d.className='nl blank'; out.appendChild(d); out.scrollTop=out.scrollHeight; }, delay||0); }
  function printLines(lines,cls,base,step){ (lines||[]).forEach(function(l,i){ print(l,cls,(base||0)+i*(step||80)); }); }

  function updateStats(){
    document.getElementById('nr-lstat').textContent = (lvlIdx+1)+'/5';
    document.getElementById('nr-sstat').textContent = score;
  }
  function updateProgress(){
    const lvl = levels[lvlIdx];
    const total = lvl.obj.length;
    const done  = lvl.obj.filter(function(o){ return state[o]; }).length;
    pb.style.width = (total ? (done/total)*100 : 0)+'%';
    pblbl.textContent = done+' / '+total+' objectives';
  }

  function loadLevel(idx){
    lvlIdx = idx; state = {};
    nxtBtn.style.display = 'none';
    out.innerHTML = '';
    const lvl = levels[idx];
    document.getElementById('nr-levname').textContent = lvl.title;
    document.getElementById('nr-obj').textContent     = lvl.objective;
    document.getElementById('nr-hcontent').innerHTML  = lvl.hints.map(function(h){ return '◦ '+h; }).join('<br>');
    updateStats(); updateProgress();

    const hdr = ['════════════════════════════════════','  '+lvl.title+': '+lvl.name,'════════════════════════════════════'];
    printLines(hdr,'ascii',0,60);
    blank(hdr.length*60+40);
    printLines(lvl.boot,'sys',hdr.length*60+60,90);
    const ready = hdr.length*60 + lvl.boot.length*90 + 180;
    blank(ready-80);
    setTimeout(function(){ print('Type <span class="nr-cmd">help</span> for commands.','inf'); input.focus(); }, ready);
  }

  function checkWin(){
    const lvl = levels[lvlIdx];
    if (lvl.obj.every(function(o){ return state[o]; })){
      score += 1000; updateStats(); blank();
      if (lvlIdx < levels.length-1){
        print('◈◈◈  OBJECTIVE COMPLETE  ◈◈◈','ok');
        print('Mission accomplished. Proceed to next level.','inf');
        nxtBtn.style.display = 'inline-block';
      } else {
        showWin();
      }
    }
  }

  function showWin(){
    blank();
    var art = [
      ' ██╗   ██╗ ██████╗ ██╗   ██╗    ██╗    ██╗██╗███╗  ██╗',
      ' ╚██╗ ██╔╝██╔═══██╗██║   ██║    ██║    ██║██║████╗ ██║',
      '  ╚████╔╝ ██║   ██║██║   ██║    ██║ █╗ ██║██║██╔██╗██║',
      '   ╚██╔╝  ██║   ██║╚██╗ ██╔╝    ██║███╗██║██║██║╚████║',
      '    ██║   ╚██████╔╝ ╚████╔╝     ╚███╔███╔╝██║██║ ╚███║',
      '    ╚═╝    ╚═════╝   ╚═══╝       ╚══╝╚══╝ ╚═╝╚═╝  ╚══╝',
    ];
    art.forEach(function(l,i){ setTimeout(function(){ var d=document.createElement('div'); d.className='nl win'; d.textContent=l; out.appendChild(d); out.scrollTop=out.scrollHeight; }, i*100); });
    var t = art.length*100+200;
    blank(t);
    print('FINAL SCORE: <span style="color:#ffff00;text-shadow:0 0 10px #ffff00">'+score+'</span>','ok',t+80);
    print('BLACKNET has been breached. All objectives complete.','ok',t+160);
    print('Type <span class="nr-cmd">restart</span> to play again.','inf',t+240);
  }

  function handleCmd(raw){
    const cmd = raw.trim();
    if (!cmd) return;
    history.unshift(cmd); histIdx = -1;
    blank(); print(cmd,'echo');

    if (cmd === 'restart'){ score=0; setTimeout(function(){ loadLevel(0); },300); return; }
    if (cmd === 'clear')  { out.innerHTML=''; return; }

    const lvl   = levels[lvlIdx];
    const entry = lvl.commands[cmd.toLowerCase()];
    if (entry){
      printLines(entry.r, entry.t==='sys'?'sys':entry.t==='err'?'err':entry.t==='ok'?'ok':'inf', 60, 70);
      if (entry.o && !state[entry.o]){
        state[entry.o]=true; score+=200; updateStats(); updateProgress();
        setTimeout(checkWin, entry.r.length*70+120);
      }
    } else {
      print('Command not found: '+cmd,'err',60);
      print('Type <span class="nr-cmd">help</span> for available commands.','inf',120);
    }
  }

  input.addEventListener('keydown', function(e){
    if (e.key==='ArrowUp')  { histIdx=Math.min(histIdx+1,history.length-1); input.value=history[histIdx]||''; e.preventDefault(); return; }
    if (e.key==='ArrowDown'){ histIdx=Math.max(histIdx-1,-1); input.value=histIdx===-1?'':history[histIdx]; e.preventDefault(); return; }
    if (e.key!=='Enter') return;
    var v=input.value; input.value=''; handleCmd(v);
  });

  document.getElementById('nr-overlay').addEventListener('click', function(){ input.focus(); });

  return {
    start: function(){ loadLevel(0); },
    next:  function(){ document.getElementById('nr-next').style.display='none'; loadLevel(lvlIdx+1); }
  };
})();

function nrOpen(){
  document.getElementById('nr-overlay').classList.add('active');
  NR.start();
}
function nrClose(){
  document.getElementById('nr-overlay').classList.remove('active');
  document.getElementById('nr-out').innerHTML='';
}
function nrNextLevel(){
  NR.next();
}
</script>
</body>
</html>
