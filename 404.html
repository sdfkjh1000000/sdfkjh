<style>
  /* ── self-hosted fonts ─────────────────────────────────────── */
  @font-face {
    font-family: 'Newsreader'; font-style: normal; font-weight: 500;
    font-display: swap; src: url('/assets/fonts/newsreader-500.woff2') format('woff2');
  }
  @font-face {

  @font-face {

  @font-face {
    font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 700;

  :root {
    --paper:     #FDFBF7;
    --surface:   #FFFFFF;
    --ink:       #1C1917;
    --ink-soft:  #57534E;
    --border:    #E7E5E4;
    --amber:     #ff7a1a;
    --amber-dim: #b8551a;
    --serif:     "Newsreader", Georgia, serif;
    --body:      "Source Serif 4", Georgia, serif;
    --mono:      "JetBrains Mono", "Consolas", monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--body); }
  body { font-size: 17px; line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; }

  .skip-link {
    position: absolute; top: -100px; left: 12px; background: var(--ink); color: var(--paper);
    border: 1px solid var(--amber-dim); border-radius: 2px; padding: 0.5rem 0.9rem;
    font-family: var(--mono); font-size: 0.8rem; text-decoration: none; z-index: 100; transition: top 0.15s;
  }
  .skip-link:focus { top: 12px; outline: none; }
  a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--amber-dim); outline-offset: 3px; border-radius: 1px; }

  /* header */
  header[role="banner"] {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 32px; border-bottom: 1px solid var(--border);
  }
  header .wm { font-family: var(--mono); font-weight: 500; font-size: 15px; letter-spacing: 0.04em; color: var(--ink); text-decoration: none; }
  header .wm .br { color: var(--amber-dim); }
  header nav a { font-family: var(--body); font-size: 14px; color: var(--ink-soft); text-decoration: none; }
  header nav a:hover { color: var(--amber-dim); }

  /* document */
  main { flex: 1; max-width: 680px; margin: 0 auto; padding: 96px 32px 72px; }
  .code {
    font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--amber-dim); margin: 0 0 12px;
  }
  h1 {
    font-family: var(--serif); font-weight: 500; font-size: clamp(48px, 9vw, 88px);
    line-height: 1; letter-spacing: -0.02em; margin: 0 0 14px;
  }
  .lede {
    font-family: var(--body); font-style: italic; font-size: clamp(18px, 2.4vw, 22px);
    color: var(--ink-soft); margin: 0 0 28px;
  }
  p { margin: 0 0 16px; }
  .home-row {
    font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.35em;
    color: var(--ink-soft); margin: 28px 0 0; padding-top: 18px; border-top: 1px solid var(--border);
  }
  .home-row .lit { color: var(--amber-dim); font-weight: 700; }
  a.back {
    font-family: var(--mono); font-size: 13px; color: var(--amber-dim);
    text-decoration: none; border-bottom: 1px solid rgba(184,85,26,0.35);
  }
  a.back:hover { border-bottom-color: var(--amber-dim); }

  /* footer */
  footer[role="contentinfo"] {
    padding: 26px 32px; font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
    letter-spacing: 0.04em; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  footer a { color: var(--ink-soft); text-decoration: none; }
  footer a:hover { color: var(--amber-dim); }
  footer .dot { color: var(--amber-dim); }

  @media (max-width: 560px) {
    header[role="banner"] { padding: 18px 20px; }
    main { padding: 64px 20px 52px; }
    footer[role="contentinfo"] { padding: 22px 20px; flex-direction: column; align-items: flex-start; }
  }

  @media print {
    .skip-link, header nav { display: none !important; }
    html, body { background: #fff !important; }
  }
</style>
</head>
